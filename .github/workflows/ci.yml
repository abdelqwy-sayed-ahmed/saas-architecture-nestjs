name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: master_tenant_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: master_tenant_db

      MASTER_DATABASE_URL: mysql://root:root@localhost:3306/master_tenant_db
      TENANT_DATABASE_URL: mysql://root:root@localhost:3306/dev_tenant_db

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Wait for MySQL
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."
          for i in {1..20}; do
            mysqladmin ping -h"127.0.0.1" -uroot -proot && break
            echo "MySQL not ready yet..."
            sleep 2
          done

      # 5. Generate Prisma Clients
      - name: Generate Prisma Clients
        run: npm run prisma-client:generate

      # ✅ 6. BUILD FIRST (IMPORTANT)
      - name: Build project
        run: npm run build

      # ✅ 7. Run Master Migrations (compiled JS)
      - name: Run Master Migrations
        run: npm run migrate:master

      # ✅ 8. Run Tenant Migrations
      - name: Run Tenant Migrations
        run: npm run migrate:tenants

      # 9. Run tests
      - name: Run tests
        run: npm run test --if-present

      # 10. Build Docker image
      - name: Build Docker image
        run: docker build -t prisma-tenants-app:test .