
services:
  app:
    build: .
    container_name: prisma_tenants_app
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    env_file:
      - .env.docker
    restart: always

  mysql:
    image: mysql:8
    container_name: mysql_prisma_tenants
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: master_tenant_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: